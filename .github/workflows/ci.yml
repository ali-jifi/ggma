name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.15.21"
      - run: ruff check .

  test:
    # Torch-free tests only: matchers, split logic, curve diagnostics, and the
    # safety-side split/guard/labeler invariants. No GPU, no model download, and
    # nothing needing the built datasets (vendor/data is git-ignored, so a bare
    # runner does not have it) -- just numpy + pytest, so this stays fast and free.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy pytest
      - run: pytest -q commitment/tests/ safety/tests/
